<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMP - Autonomous Development Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .request-card {
            transition: all 0.3s ease;
        }
        .request-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .priority-critical { border-left-color: #dc2626; }
        .priority-high { border-left-color: #f59e0b; }
        .priority-medium { border-left-color: #3b82f6; }
        .priority-low { border-left-color: #10b981; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto p-6" x-data="autonomousDevRequests()">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">
                🤖 Autonomous Development Requests
            </h1>
            <p class="text-gray-600">
                Development requests automatically generated by AI agents based on system self-assessment
            </p>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-2 bg-red-100 rounded-lg">
                        <i class="fas fa-exclamation-triangle text-red-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Critical</p>
                        <p class="text-2xl font-bold text-gray-900" x-text="summary.critical || 0"></p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-2 bg-yellow-100 rounded-lg">
                        <i class="fas fa-bolt text-yellow-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">High</p>
                        <p class="text-2xl font-bold text-gray-900" x-text="summary.high || 0"></p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-2 bg-blue-100 rounded-lg">
                        <i class="fas fa-info-circle text-blue-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Medium</p>
                        <p class="text-2xl font-bold text-gray-900" x-text="summary.medium || 0"></p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-2 bg-green-100 rounded-lg">
                        <i class="fas fa-check-circle text-green-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Low</p>
                        <p class="text-2xl font-bold text-gray-900" x-text="summary.low || 0"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex space-x-4">
                <button @click="fetchRequests()" :disabled="loading" 
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 disabled:opacity-50">
                    <i class="fas fa-sync-alt" :class="{'fa-spin': loading}"></i>
                    Refresh
                </button>
                <button @click="triggerSelfAssessment()" 
                        class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                    <i class="fas fa-brain"></i>
                    Trigger Self-Assessment
                </button>
            </div>
            <div class="text-sm text-gray-500">
                Last updated: <span x-text="lastUpdate || 'Never'"></span>
            </div>
        </div>

        <!-- Requests List -->
        <div class="space-y-4">
            <template x-for="request in requests" :key="request.request_id">
                <div class="bg-white rounded-lg shadow request-card border-l-4"
                     :class="`priority-${request.priority}`">
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex-1">
                                <div class="flex items-center space-x-3 mb-2">
                                    <span class="text-lg font-semibold text-gray-900" x-text="request.description"></span>
                                    <span class="px-2 py-1 text-xs font-medium rounded-full"
                                          :class="{
                                              'bg-red-100 text-red-800': request.priority === 'critical',
                                              'bg-yellow-100 text-yellow-800': request.priority === 'high',
                                              'bg-blue-100 text-blue-800': request.priority === 'medium',
                                              'bg-green-100 text-green-800': request.priority === 'low'
                                          }"
                                          x-text="request.priority.toUpperCase()">
                                    </span>
                                </div>
                                <div class="text-sm text-gray-600 mb-2">
                                    <strong>Agent:</strong> <span x-text="request.agent_id"></span> | 
                                    <strong>Type:</strong> <span x-text="request.request_type"></span> |
                                    <strong>Effort:</strong> <span x-text="request.estimated_effort"></span>
                                </div>
                                <div class="text-sm text-gray-500 mb-3">
                                    <span x-text="new Date(request.timestamp).toLocaleString()"></span>
                                </div>
                            </div>
                            <button @click="markCompleted(request.request_id)"
                                    class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700">
                                <i class="fas fa-check"></i> Complete
                            </button>
                        </div>
                        
                        <!-- Technical Details -->
                        <div class="bg-gray-50 rounded p-4 mb-4">
                            <h4 class="font-medium text-gray-900 mb-2">Technical Details:</h4>
                            <pre class="text-xs text-gray-700 whitespace-pre-wrap" x-text="JSON.stringify(request.technical_details, null, 2)"></pre>
                        </div>
                        
                        <!-- Suggested Solution -->
                        <div x-show="request.suggested_solution" class="bg-blue-50 rounded p-4">
                            <h4 class="font-medium text-blue-900 mb-2">Suggested Solution:</h4>
                            <p class="text-sm text-blue-800" x-text="request.suggested_solution"></p>
                        </div>
                    </div>
                </div>
            </template>
            
            <!-- No requests -->
            <div x-show="!loading && requests.length === 0" class="text-center py-12">
                <i class="fas fa-robot text-4xl text-gray-400 mb-4"></i>
                <p class="text-gray-600">No autonomous development requests at this time.</p>
                <p class="text-sm text-gray-500">AI agents will generate requests based on system analysis.</p>
            </div>
            
            <!-- Loading -->
            <div x-show="loading" class="text-center py-12">
                <i class="fas fa-spinner fa-spin text-2xl text-blue-600"></i>
                <p class="text-gray-600 mt-2">Loading requests...</p>
            </div>
        </div>
    </div>

    <script>
        function autonomousDevRequests() {
            return {
                requests: [],
                summary: {},
                loading: false,
                lastUpdate: null,
                
                async init() {
                    await this.fetchRequests();
                    
                    // Auto-refresh every 30 seconds
                    setInterval(() => {
                        this.fetchRequests();
                    }, 30000);
                },
                
                async fetchRequests() {
                    this.loading = true;
                    try {
                        const response = await fetch('/autonomous/development-requests');
                        const data = await response.json();
                        
                        if (data.success) {
                            this.requests = data.requests;
                            this.summary = data.summary;
                            this.lastUpdate = new Date().toLocaleTimeString();
                        } else {
                            console.error('Error fetching requests:', data.error);
                        }
                    } catch (error) {
                        console.error('Network error:', error);
                    }
                    this.loading = false;
                },
                
                async markCompleted(requestId) {
                    try {
                        const response = await fetch(`/autonomous/development-requests/${requestId}/complete`, {
                            method: 'POST'
                        });
                        
                        if (response.ok) {
                            // Remove from local list
                            this.requests = this.requests.filter(r => r.request_id !== requestId);
                            // Refresh summary
                            await this.fetchRequests();
                        } else {
                            console.error('Error marking request completed');
                        }
                    } catch (error) {
                        console.error('Network error:', error);
                    }
                },
                
                async triggerSelfAssessment() {
                    try {
                        const response = await fetch('/autonomous/system-health');
                        const data = await response.json();
                        
                        if (data.success) {
                            alert('Self-assessment triggered successfully!');
                            // Refresh requests after a delay
                            setTimeout(() => this.fetchRequests(), 2000);
                        }
                    } catch (error) {
                        console.error('Error triggering self-assessment:', error);
                    }
                }
            }
        }
    </script>
</body>
</html>
